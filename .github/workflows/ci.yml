# Continuous checks — runs on every push / pull request and shows a ✓ or ✗ next to the
# commit in the repo's "Actions" tab (and a red X on any commit that breaks). Deliberately
# fast + deterministic: type-check + unit tests only, NO network `pull` step, so it never
# flakes on Letterboxd/Spotify being slow. The Pages deploy stays a separate concern.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type + template check
        run: npm run check
      - name: Unit tests
        run: npm test
