name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # PRs run the same checks + build, but never deploy
  schedule:
    - cron: '0 6 * * *'   # daily — re-pull Letterboxd / Steam / PSN / Substack and redeploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref groups: PR builds get their own lane and can never cancel an in-flight
# main deploy; pushes/cron/dispatch on main still serialize with each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Restore the previous run's pulled JSON + downloaded artwork so scripts/pull.mjs
      # "keep last good" has something to keep on a clean checkout. The unique key never
      # hits, so restore-keys picks the most recent save and the post-job step saves this
      # run's fresh data under the new key.
      # writing.json is deliberately NOT here: Substack 403s GitHub's IPs, so that file is
      # git-tracked and refreshed by publish.cmd on the owner's machine — a cache restore
      # would clobber the committed copy with a stale one. (v2 key: pre-split tars contain
      # writing.json and must never be restored.)
      - name: Restore last-good fed data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/generated/films.json
            src/generated/lastplayed.json
            src/generated/music.json
            src/generated/signals.json
            src/generated/art
            public/audio-cache
          key: fed-data-v2-${{ github.run_id }}
          restore-keys: |
            fed-data-v2-

      - name: Type check
        run: npx astro check

      # Deterministic static assets (ASCII banner + OG share image) — regenerated every
      # build so a name/tagline change can't ship a stale og.png.
      - name: Generate banner + OG image
        run: node scripts/generate.mjs

      - name: Build
        run: npm run build
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps['deployment-retry'].outputs.page_url }}
    steps:
      # The Pages API intermittently answers "Deployment failed, try again later." —
      # observed on otherwise-identical runs that pass on retry. One automatic retry
      # (after a short pause) so a publish never needs a manual re-push.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
